name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Configure checkout-local temporary directories
        shell: pwsh
        run: |
          $taskTemp = Join-Path $env:GITHUB_WORKSPACE '.sites-runtime/tmp'
          $taskCache = Join-Path $env:GITHUB_WORKSPACE '.sites-runtime/npm-cache'
          New-Item -ItemType Directory -Force -Path $taskTemp,$taskCache | Out-Null
          "TEMP=$taskTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$taskTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "npm_config_cache=$taskCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:architecture
      - run: npm run test:unit
      - run: npm run build
      - run: npm audit
      - run: npm audit --omit=dev

  integration:
    name: Built Worker integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Configure checkout-local temporary directories
        shell: pwsh
        run: |
          $taskTemp = Join-Path $env:GITHUB_WORKSPACE '.sites-runtime/tmp'
          $taskCache = Join-Path $env:GITHUB_WORKSPACE '.sites-runtime/npm-cache'
          New-Item -ItemType Directory -Force -Path $taskTemp,$taskCache | Out-Null
          "TEMP=$taskTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$taskTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "npm_config_cache=$taskCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration:local
      - run: npm run test:integration:persistence
